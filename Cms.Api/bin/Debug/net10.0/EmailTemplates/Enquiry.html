<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>New website enquiry</title>
</head>
<body style="margin:0;padding:0;background:#eef2ef;font-family:'Segoe UI',Arial,Helvetica,sans-serif;color:#1b2420;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#eef2ef;padding:24px 0;">
    <tr><td align="center">
      <table role="presentation" width="600" cellspacing="0" cellpadding="0" style="max-width:600px;width:94%;background:#ffffff;border-radius:10px;overflow:hidden;">
        <tr><td style="background:#1f4b3f;padding:22px 28px;color:#ffffff;font-size:18px;font-weight:600;">New website enquiry</td></tr>
        <tr><td style="padding:26px 28px 8px 28px;font-size:15px;line-height:1.55;">
          <p style="margin:0 0 4px 0;color:#5b6b64;font-size:13px;">From</p>
          <p style="margin:0 0 18px 0;"><strong>{Name}</strong> &lt;<a href="mailto:{EmailAddress}" style="color:#1f4b3f;">{EmailAddress}</a>&gt;</p>
          <p style="margin:0 0 4px 0;color:#5b6b64;font-size:13px;">Message</p>
          <p style="margin:0 0 18px 0;padding:14px 16px;background:#f4f7f5;border-left:3px solid #d9a441;">{Message}</p>
        </td></tr>
        <tr><td style="padding:0 28px 24px 28px;color:#5b6b64;font-size:12.5px;">
          Received {DateSubmitted} through <a href="{SiteUrl}" style="color:#1f4b3f;">{SiteUrl}</a>.<br>
          Reply to this email to answer the sender directly. A copy is kept in the CMS under Enquiries.
        </td></tr>
      </table>
      <p style="font-size:12px;color:#86938d;margin:14px 0 0 0;">&copy; {Year} Biggi Junior School</p>
    </td></tr>
  </table>
</body>
</html>
